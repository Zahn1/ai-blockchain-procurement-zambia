# Caliper network configuration for the prototype's Fabric network (generated by run.sh from this template)
name: procurement
version: "2.0.0"
caliper:
  blockchain: fabric
channels:
  - channelName: procurement
    contracts:
      - id: procurement
organizations:
  - mspid: ZPPAMSP
    identities:
      certificates:
        - name: officer1
          clientPrivateKey:
            path: KEY_PATH
          clientSignedCert:
            path: ../network/zambia/organizations/peerOrganizations/zppa.example.com/users/officer1@zppa.example.com/msp/signcerts/cert.pem
    connectionProfile:
      path: ../network/zambia/organizations/peerOrganizations/zppa.example.com/connection-zppa.yaml
      discover: true
