name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  chaincode:
    name: Chaincode (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chaincode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: chaincode/go.mod
          cache-dependency-path: chaincode/go.sum
      - run: go vet ./...
      - run: go test -race -cover -v ./...

  backend:
    name: Back end (Node.js)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: procurement
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: procurement
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U procurement" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://procurement:ci-only@localhost:5432/procurement?schema=public
      TEST_DATABASE_URL: postgresql://procurement:ci-only@localhost:5432/procurement?schema=test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm test -- --verbose --runInBand

  ai:
    name: AI scripts (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai/requirements.txt
      - run: python -m py_compile ai/scripts/*.py ai/risk/*.py ai/service/*.py
      - run: pip install -r ai/requirements.txt
      - name: AI service tests (pytest)
        working-directory: ai
        run: pytest -v

  frontend:
    name: Front end (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx vitest run
      - run: npx vite build
